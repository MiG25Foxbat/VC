services:
  - type: web
    name: agent-otklikov-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DADATA_TOKEN
        sync: false
      - key: SUPERJOB_APP_ID
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "604800"
      - key: HTTP_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_CONCURRENT_SOURCES
        value: "6"
